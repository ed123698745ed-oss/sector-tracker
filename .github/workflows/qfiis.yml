name: 抓證交所月底發行股數（MI_QFIIS）

on:
  push:
    paths: ['test/QFIIS_TRIGGER']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qfiis-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取（最多 5 小時，被擋時程式自行退避；每 20 份提交一次）
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          timeout 300m python3 scripts/fetch_qfiis.py config/month_end_dates.json || true
      - name: 提交
        if: always()
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/raw/twse_qfiis
          git commit -m "MI_QFIIS 原始檔 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
