name: 更新發行股數

on:
  push:
    paths: ['test/SHARES_TRIGGER']
  schedule:
    - cron: '7 0 1 * *'   # 每月 1 日台北 08:07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/shares.py
      - name: 提交
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/shares_fields.txt; [ -f config/shares.json ] && git add config/shares.json
          git commit -m "更新發行股數 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
