name: 更新發行股數

on:
  push:
    paths: ['test/SHARES_TRIGGER']
  schedule:
    - cron: '7 0 1 * *'   # 每月 1 日台北 08:07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/shares.py
      - name: 提交
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/shares_fields.txt; [ -f config/shares.json ] && git add config/shares.json
          git commit -m "更新發行股數 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && { pushed=1; break; }; sleep 10; done; [ -n "$pushed" ] || { echo "::error::git push 重試後仍失敗"; exit 1; }
      - name: 失敗通知（LINE）
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
