name: 臨時休市偵測

# 2026-10-23 颱風休市要人工登錄 closed.txt（事故 4）→ 改成自動。
# 每 30 分鐘看證交所最新消息，公告「集中交易市場 X 月 X 日休市一天」就寫入 data/closed.txt、重算網頁、LINE 通知。
# 颱風假多在前一天傍晚～晚上公告（週日晚上也可能宣布週一），所以每天都跑；清晨再補看兩次。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只印不寫、不推 LINE（填 1）'
        required: false
        default: '1'
  schedule:
    - cron: '*/30 9-15 * * *'   # 台北 17:00～23:30
    - cron: '0 22,23 * * *'     # 台北 06:00、07:00

permissions:
  contents: write

concurrency:
  group: daily-update        # 與每日更新共用，避免同時改 docs/
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/closure_watch.py
      - name: 有新休市日就重算網頁（週結算需要知道本週提早結束）並提交
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/closed.txt data/closure_seen.txt 2>/dev/null || git add data/closed.txt
          if git diff --cached --quiet; then echo "沒有新公告"; exit 0; fi
          if ! git diff --cached --quiet -- data/closed.txt; then python3 scripts/build.py && git add docs; fi
          git commit -m "臨時休市自動登錄 $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
