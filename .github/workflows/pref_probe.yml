name: 特別股抓取連線測試

on:
  push:
    paths: ['test/PREF_PROBE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 執行測試腳本
        run: |
          bash test/probe.sh
          git config user.name "sector-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add test/pref_probe.txt; git commit -qm "特別股抓取連線測試結果 [skip ci]"; for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
