name: 除權息參考價補抓並重算

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 查詢
        run: python3 scripts/_probe.py
      - name: 推暫存分支
        run: |
          cd /tmp/p && git init -q && git config user.name probe && git config user.email probe@x
          git checkout -q -b tmp-probe && git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-probe
