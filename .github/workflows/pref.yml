name: 抓特別股公司普通股股本

on:
  push:
    paths: ['test/PREF_TRIGGER']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pref-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取（最多 5 小時，被擋時程式自行退避）
        run: timeout 300m python3 scripts/fetch_common_capital.py config/pref_targets.json || true
      - name: 提交
        if: always()
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/raw/mops_bs_co
          git commit -m "特別股公司個別資產負債表原始檔 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
