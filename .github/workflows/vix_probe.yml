name: 臺指VIX來源測試

on:
  push:
    paths: ['test/VIX_PROBE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 執行測試腳本
        run: |
          bash test/vix_probe.sh || true
          git config user.name "sector-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add test/vix_probe.txt; git commit -qm "臺指VIX來源測試結果 [skip ci]"; for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && { pushed=1; break; }; sleep 5; done; [ -n "$pushed" ] || { echo "::error::git push 重試後仍失敗"; exit 1; }
