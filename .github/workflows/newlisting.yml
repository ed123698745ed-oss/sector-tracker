name: 抓初次上市櫃日期

on:
  push:
    paths: ['test/NEWLISTING_TRIGGER']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/fetch_newlisting.py
      - if: always()
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/raw/twse_newlisting archive/raw/tpex_companies
          git commit -m "初次上市櫃日期原始檔 [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
