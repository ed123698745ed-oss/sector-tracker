name: 每日族群追蹤更新

on:
  schedule:
    # 台北時間週一至週五 13:52、14:12、14:32、14:52、15:12、15:42、16:20、18:20（cron 為 UTC）
    # 收盤資料公布時間不固定，分段重試；當天已抓到就跳過。分鐘避開整點以減少 GitHub 排程延遲
    - cron: '52 5 * * 1-5'
    - cron: '12 6 * * 1-5'
    - cron: '32 6 * * 1-5'
    - cron: '52 6 * * 1-5'
    - cron: '12 7 * * 1-5'
    - cron: '42 7 * * 1-5'
    - cron: '20 8 * * 1-5'
    - cron: '20 10 * * 1-5'
  push:
    paths: ['test/DAILY_TRIGGER']   # 備用：排程沒觸發時，改這個檔案即可手動觸發
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（空白＝今天）'
        required: false

permissions:
  contents: write
  actions: write   # 補觸發可轉債追蹤 cb.yml

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 補觸發可轉債追蹤（cb.yml 的 GitHub 排程常漏觸發；本工作由 cron-job.org 準時觸發，16:00、16:30、18:00 會補）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          H=$(TZ=Asia/Taipei date +%H%M); W=$(TZ=Asia/Taipei date +%u); T=$(TZ=Asia/Taipei date +%Y%m%d)
          if [ "$W" -le 5 ] && [ "$H" -ge 1530 ] && [ "$H" -le 2059 ]; then
            DONE=$(gh api "repos/$GH_REPO/contents/archive/raw/tpex_cb/${T:0:4}/$T.csv.gz" --silent && echo 1 || echo 0)
            N=$(gh run list -w cb.yml -L 10 --json status --jq "[.[] | select(.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\" or .status==\"pending\")] | length")
            echo "可轉債當日已存：$DONE；進行中／排隊：$N"
            if [ "$DONE" = "0" ] && [ "$N" = "0" ]; then gh workflow run cb.yml --ref main && echo "已觸發可轉債追蹤更新"; fi
          else echo "非 15:30～20:59，略過"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取收盤行情（原始檔一併存 archive/raw）
        id: fetch
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Taipei date +%Y%m%d) || D=$(echo "$D" | tr -d -)
          if [ -f "data/quotes/$D.json" ] || [ -f "archive/raw/twse/$D.json.gz" ]; then echo "$D 已處理，跳過"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # 臨時休市（颱風等，closure_watch 寫入 data/closed.txt）視同休市，不抓也不報錯（2026-11-03 檢驗報告第 5 項）
          if [ -f data/closed.txt ] && grep -qx "$D" data/closed.txt; then echo "$D 臨時休市（closed.txt），跳過"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 scripts/backfill.py run "$D"
          if [ -f "data/quotes/$D.json" ] || [ -f "archive/raw/twse/$D.json.gz" ]; then exit 0; fi
          H=$(TZ=Asia/Taipei date +%H)
          if [ "$H" -ge 18 ] || [ -n "${{ github.event.inputs.date }}" ]; then echo "::error::$D 收盤資料抓取失敗"; exit 1; fi
          echo "$D 資料尚未公布，等下一次排程"; echo "skip=1" >> "$GITHUB_OUTPUT"
      - name: 計算上榜題材
        if: steps.fetch.outputs.skip != '1'
        run: python3 scripts/build.py
      - name: 市場階段警示（階段改變才推 LINE）
        if: steps.fetch.outputs.skip != '1'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 scripts/notify.py || true
      - name: 權值與高價股分頁（月初更新名單、每日計算指標；失敗不影響族群頁）
        if: steps.fetch.outputs.skip != '1'
        continue-on-error: true
        run: |
          pip install -q numpy
          python3 scripts/wh_monthly.py || echo "::warning::名單月更新失敗，沿用上月名單"
          python3 scripts/wh_prices.py
          python3 scripts/wh_build.py
      - name: 率先創新高分頁（用 wh_build 產生的 cache；失敗不影響其他頁）
        if: steps.fetch.outputs.skip != '1'
        continue-on-error: true
        run: python3 scripts/ny_build.py
      - name: 臺指 VIX（期交所每月檔＋盤後即時；失敗不影響其他頁）
        continue-on-error: true
        run: python3 scripts/vix.py daily
      - name: 權值高價股市場狀態改變推 LINE（Ed 2026-10-30 指示暫停）
        if: false  # 暫停推播；恢復時改回 steps.fetch.outputs.skip != '1'
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Taipei date +%Y%m%d) || D=$(echo "$D" | tr -d -)
          # 正式推播仍啟用。同日重跑若 ledger 已有同一狀態變化的送達紀錄會略過；失敗會寫 ledger。
          python3 scripts/wh_notify.py --expect-date "$D" || true
      - name: 提交推播紀錄（單獨、先於資料提交）
        id: ledger
        if: always() && steps.fetch.outputs.skip != '1'
        continue-on-error: true
        run: |
          # 先把 ledger 單獨推上去：之後整包資料提交失敗時，下次乾淨 checkout 仍看得到已送達／失敗紀錄。
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/wh_notify_ledger.json ] || { echo "無推播紀錄"; exit 0; }
          git add data/wh_notify_ledger.json
          if git diff --cached --quiet; then echo "推播紀錄未變"; exit 0; fi
          git commit -q -m "市場狀態推播紀錄 $(TZ=Asia/Taipei date +%Y-%m-%d) [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 10; done
          echo "::error::推播紀錄 push 失敗，ledger 已上傳 artifact，需人工補提交（見 docs/wh-market-state-rules.md 第 6 節）"
          exit 1
      - name: 推播紀錄 push 失敗時保留 ledger
        if: always() && steps.ledger.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wh-notify-ledger-${{ github.run_id }}
          path: data/wh_notify_ledger.json
          retention-days: 30
      - name: 權值高價股市場狀態推播重試（僅補送已記錄的失敗；暫停中）
        if: false  # 暫停推播；恢復時改回 always() && steps.fetch.outputs.skip == '1'
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          D="${{ github.event.inputs.date }}"; [ -z "$D" ] && D=$(TZ=Asia/Taipei date +%Y%m%d) || D=$(echo "$D" | tr -d -)
          python3 scripts/wh_notify.py --retry-only --expect-date "$D" || true
      - name: 提交推播重試紀錄
        id: retryledger
        if: always() && steps.fetch.outputs.skip == '1'
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/wh_notify_ledger.json ]; then git add data/wh_notify_ledger.json; fi
          if git diff --cached --quiet; then echo "推播紀錄未變"; exit 0; fi
          git commit -m "市場狀態推播重試紀錄 $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 10; done
          echo "::error::推播重試紀錄 push 失敗，ledger 已上傳 artifact，需人工補提交（見 docs/wh-market-state-rules.md 第 6 節）"
          exit 1
      - name: 推播重試紀錄 push 失敗時保留 ledger
        if: always() && steps.retryledger.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wh-notify-ledger-${{ github.run_id }}
          path: data/wh_notify_ledger.json
          retention-days: 30
      - name: 提交更新
        if: steps.fetch.outputs.skip != '1'
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive data docs config/wh_lists.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && { pushed=1; break; }; sleep 10; done; [ -n "$pushed" ] || { echo "::error::git push 重試後仍失敗"; exit 1; }
      - name: 失敗通知（LINE）
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 scripts/notify_failure.py "${{ github.workflow }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
