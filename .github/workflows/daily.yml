name: 每日族群追蹤更新

on:
  schedule:
    # 台北時間週一至週五 16:20 與 18:20（UTC 08:20、10:20）；第二次為補抓，資料已存在則跳過
    - cron: '20 8 * * 1-5'
    - cron: '20 10 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 YYYY-MM-DD（空白＝今天）'
        required: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取收盤行情
        run: python3 scripts/quotes.py fetch ${{ github.event.inputs.date }}
      - name: 計算上榜題材
        run: python3 scripts/build.py
      - name: 提交更新
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/quotes docs/data.json
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d)"
          git push
