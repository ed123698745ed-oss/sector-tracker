name: 盤中族群暫定

on:
  workflow_dispatch:
  push:
    paths: ['test/TRIGGER']
  schedule:
    # 備援：台北 09:05～13:35 每 10 分鐘（主要由 cron-job.org 準時觸發）
    - cron: '5-59/10 1-4 * * 1-5'
    - cron: '5-35/10 5 * * 1-5'

permissions:
  contents: write

concurrency:
  group: intraday
  cancel-in-progress: true

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - name: 只在盤中執行
        id: tw
        run: |
          H=$(TZ=Asia/Taipei date +%H%M); W=$(TZ=Asia/Taipei date +%u)
          if [ "$W" -le 5 ] && [ "$H" -ge 0900 ] && [ "$H" -le 1345 ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "非盤中時間，略過"; fi
      - uses: actions/checkout@v4
        if: steps.tw.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.tw.outputs.go == '1'
        with:
          python-version: '3.12'
      - if: steps.tw.outputs.go == '1'
        run: python3 scripts/intraday.py
      - name: 提交
        if: steps.tw.outputs.go == '1'
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/intraday.json test/mis_result.txt
          git commit -m "盤中暫定 $(TZ=Asia/Taipei date +%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
