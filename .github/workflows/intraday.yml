name: 盤中族群暫定

on:
  workflow_dispatch:
  push:
    paths: ['test/TRIGGER']
  schedule:
    # 備援：台北 09:05～13:35 每 10 分鐘（主要由 cron-job.org 準時觸發）；cron-job.org 另在晚上 21:15～22:45 觸發，用來補跑融資觀察
    - cron: '5-59/10 1-4 * * 1-5'
    - cron: '5-35/10 5 * * 1-5'

permissions:
  contents: write
  actions: write

concurrency:
  group: intraday
  cancel-in-progress: true

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - name: 只在盤中執行
        id: tw
        run: |
          H=$(TZ=Asia/Taipei date +%H%M); W=$(TZ=Asia/Taipei date +%u)
          if [ "$W" -le 5 ] && [ "$H" -ge 0900 ] && [ "$H" -le 1345 ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "非盤中時間，略過"; fi
      - name: 權值高價股／融資觀察盤中迴圈若沒在跑就啟動（GitHub 排程常漏觸發，靠本工作每 10 分鐘補）
        if: steps.tw.outputs.go == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          D=$(TZ=Asia/Taipei date +%Y-%m-%d)
          N=$(gh run list -w wh_intraday.yml -L 10 --json status,createdAt --jq "[.[] | select((.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\" or .status==\"pending\"))] | length")
          echo "權值盤中迴圈進行中／排隊：$N"
          if [ "$N" = "0" ]; then gh workflow run wh_intraday.yml --ref main && echo "已啟動權值盤中迴圈"; fi
      - name: 晚上補觸發融資觀察每日更新（GitHub 排程常漏觸發；margin.yml 自己會判斷當天是否已處理）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          H=$(TZ=Asia/Taipei date +%H%M); W=$(TZ=Asia/Taipei date +%u)
          if [ "$W" -le 5 ] && [ "$H" -ge 2105 ] && [ "$H" -le 2359 ]; then
            N=$(gh run list -w margin.yml -L 10 --json status --jq "[.[] | select(.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\" or .status==\"pending\")] | length")
            echo "融資更新進行中／排隊：$N"
            if [ "$N" = "0" ]; then gh workflow run margin.yml --ref main && echo "已觸發融資觀察每日更新"; fi
          else echo "非晚間融資時段，略過"; fi
      - name: 晚上補觸發可轉債追蹤（GitHub 排程常漏觸發；cb.yml 會自行判斷是否已有當日資料）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          H=$(TZ=Asia/Taipei date +%H%M); W=$(TZ=Asia/Taipei date +%u); T=$(TZ=Asia/Taipei date +%Y%m%d)
          if [ "$W" -le 5 ] && [ "$H" -ge 2105 ] && [ "$H" -le 2359 ]; then
            DONE=$(gh api "repos/$GH_REPO/contents/archive/raw/tpex_cb/${T:0:4}/$T.csv.gz" --silent && echo 1 || echo 0)
            N=$(gh run list -w cb.yml -L 10 --json status --jq "[.[] | select(.status==\"in_progress\" or .status==\"queued\" or .status==\"waiting\" or .status==\"pending\")] | length")
            echo "可轉債當日已存：$DONE；進行中／排隊：$N"
            if [ "$DONE" = "0" ] && [ "$N" = "0" ]; then gh workflow run cb.yml --ref main && echo "已觸發可轉債追蹤更新"; fi
          else echo "非晚間時段，略過"; fi
      - uses: actions/checkout@v4
        if: steps.tw.outputs.go == '1'
      - uses: actions/setup-python@v5
        if: steps.tw.outputs.go == '1'
        with:
          python-version: '3.12'
      - if: steps.tw.outputs.go == '1'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python3 scripts/intraday.py
      - name: 提交
        if: steps.tw.outputs.go == '1'
        run: |
          git config user.name "sector-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/intraday.json test/mis_result.txt test/mis_alert.txt 2>/dev/null || git add docs/intraday.json test/mis_result.txt
          git commit -m "盤中暫定 $(TZ=Asia/Taipei date +%H:%M)" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 5; done
