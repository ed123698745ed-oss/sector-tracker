name: 歷史回補（接力）
# 由 backfill/REQUEST 指定期間；每輪 4 個工作各抓一段，跑完若仍有缺日自動啟動下一輪
on:
  push:
    paths: ["backfill/REQUEST"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: backfill
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        idx: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - run: |
          DATES=$(python3 scripts/backfill.py list ${{ matrix.idx }} 4 70)
          echo "本工作日期：$DATES"
          if [ -n "$DATES" ]; then timeout 50m python3 scripts/backfill.py run "$DATES" || true; fi
      - if: always()
        run: |
          git config user.name "sector-tracker-bot" && git config user.email "actions@users.noreply.github.com"
          # 除權息參考價快取由多個工作同時改寫，提交時會互相衝突導致推送失敗；屬可重抓的快取，不提交
          git checkout -- data/exright_twse.json data/exright_tpex.json 2>/dev/null || true
          git add archive data && git commit -q -m "回補 job ${{ matrix.idx }} [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 30 + 5)); done
  next:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git pull -q || true
          LEFT=$(python3 scripts/backfill.py count)
          echo "剩餘缺日：$LEFT"
          python3 scripts/build.py
          git config user.name "sector-tracker-bot" && git config user.email "actions@users.noreply.github.com"
          git add docs && git commit -q -m "回補後重算網站資料 [skip ci]" || true
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
          if [ "$LEFT" -gt 0 ] && [ ! -f backfill/STOP ]; then gh workflow run backfill.yml --ref main; fi
