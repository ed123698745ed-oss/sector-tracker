name: probe mis
on:
  push:
    branches: [probe-mis]
    paths: ['probe/probe_mis.py']
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe_mis.py
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add probe/result.json; git commit -m "probe result [skip ci]"; git push
