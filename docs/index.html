<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台股族群追蹤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* 版面：手機單欄，摘要 → 走勢 → 今日熱門 → 熱度圖 → 全題材表；數字用窄體，台股慣例紅漲綠跌 */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --fg:#151a22; --muted:#5d6676; --line:#dfe3ea;
  --accent:#3451c7; --accent-soft:#dbe2fb; --up:#cf3434; --down:#16804a; --flat:#7a8190;
  --chip:#eef1f6;
  --num:"Barlow Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141a; --panel:#191d25; --fg:#e9ecf1; --muted:#9aa3b2; --line:#2a303b;
  --accent:#7d93f0; --accent-soft:#27304d; --up:#f06c6c; --down:#3fbf78; --flat:#8a92a1; --chip:#232834;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141a; --panel:#191d25; --fg:#e9ecf1; --muted:#9aa3b2; --line:#2a303b;
  --accent:#7d93f0; --accent-soft:#27304d; --up:#f06c6c; --down:#3fbf78; --flat:#8a92a1; --chip:#232834;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-size:22px;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px}
select{font:inherit;font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:10px}
h2{margin:0;font-size:16px}
h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
/* 摘要 */
.summary{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.big{font-family:var(--num);font-weight:700;font-size:64px;line-height:.9}
.big span{font-size:22px;font-weight:500;color:var(--muted);margin-left:4px}
.facts{display:flex;flex-direction:column;gap:4px;font-size:14px;min-width:0}
.facts b{font-family:var(--num);font-size:19px;font-weight:700}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--chip)}
.badge.wide{background:var(--accent);color:var(--panel)}
.badge.narrow{background:var(--chip);color:var(--muted)}
/* 走勢圖 */
.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px}
.chart svg{display:block;width:100%;height:auto}
.tip{font-size:13px;color:var(--muted);min-height:1.5em;padding:2px 4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);padding:0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 熱門卡片 */
.intra{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:12px 14px}
.intra .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.intra .row:last-child{border-bottom:0}
.intra .g{font-weight:600;padding-top:8px;color:var(--muted);font-size:13px}
.intra .num{font-family:var(--num);white-space:nowrap}
.lab{padding:1px 7px;border-radius:999px;font-size:12px;white-space:nowrap;background:var(--chip);color:var(--muted)}
.lab-M{background:var(--accent);color:var(--panel);font-weight:600}
.lab-C{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lab-D{border:1px solid var(--line);background:transparent}
.lab-W{color:var(--down)}
.lab-S{}
.wk{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 0;font-family:var(--num)}
.wk0{color:var(--muted)}
.wk1,.wk2{border:1px solid var(--accent);color:var(--accent)}
.wk3,.wk4,.wk5{background:var(--accent);color:var(--panel);font-weight:700}
table.all td:first-child,table.all th:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
table.all tr.grp td{position:static}
table.all tr.grp .gl{position:sticky;left:10px}
sup.few{font-size:10px;color:var(--muted);margin-left:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3{margin:0;font-size:16px}
.card .avg{font-family:var(--num);font-size:20px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.chip{padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.rule{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.streak{background:var(--accent);color:var(--panel);font-weight:600}
.chip.new{border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:600}
.members{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.members span b{font-family:var(--num);font-weight:500;font-size:14px;margin-left:3px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
/* 熱度圖與表 */
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.heat{border-collapse:collapse;font-size:12px}
.heat td,.heat th{padding:0}
.heat th{font-weight:400;color:var(--muted);text-align:left;padding:3px 8px;white-space:nowrap;position:sticky;left:0;background:var(--panel)}
.heat td.c{width:13px;height:18px;border:2px solid var(--panel);background:var(--chip)}
.heat td.c.on{background:var(--accent)}
.heat td.n{padding:0 10px 0 6px;font-family:var(--num);font-size:14px;text-align:right}
.heat tr.grp th{color:var(--fg);font-weight:600;font-size:13px;padding:12px 8px 4px;border-bottom:1px solid var(--line)}
.heat .axis td{font-size:11px;color:var(--muted);padding-top:4px}
table.all{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.all th,table.all td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.all th:first-child,table.all td:first-child{text-align:left}
table.all th{font-size:12px;color:var(--muted);font-weight:500;cursor:pointer;user-select:none}
table.all tr.grp td{font-weight:600;color:var(--fg);padding-top:14px;border-bottom:1px solid var(--line)}
table.all th.sorted{color:var(--accent)}
table.all td{font-variant-numeric:tabular-nums}
table.all tr.hit td:first-child{font-weight:700}
table.all tr.hit td:first-child::after{content:" ●";color:var(--accent);font-size:10px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:14px}
footer p{margin:0;max-width:65ch}
footer .leg h4{margin:4px 0 6px;font-size:14px;color:var(--fg)}
footer .leg h4 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
footer dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;margin:0 0 6px;align-items:center}
footer dt{margin:0;text-align:center}
footer dd{margin:0;color:var(--fg);font-size:13px}
footer .fine{font-size:12px;margin-top:6px}
.hitdot{color:var(--accent);font-size:10px}
.carry{color:var(--muted);opacity:.7}
.hdr-r{display:flex;align-items:flex-end;gap:8px}
.badge.live{background:#fef3c7;color:#92400e}
@media (prefers-color-scheme:dark){.badge.live{background:#3a2a0a;color:#fcd34d}}
#refresh{font:inherit;font-size:14px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit;cursor:pointer}
#refresh:disabled{opacity:.5;cursor:default}
@media (max-width:420px){.big{font-size:54px}.summary{gap:6px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>台股族群追蹤</h1>
      <div class="sub" id="sub">讀取資料中…</div>
    </div>
    <div class="hdr-r">
      <label class="sub">交易日
        <select id="day" aria-label="選擇交易日"></select>
      </label>
      <button id="refresh" type="button" aria-label="重新整理資料">重新整理</button>
    </div>
  </header>

  <section id="intra" hidden>
    <h2>盤中暫定<small id="intraSub"></small></h2>
    <div class="intra" id="intraBody"></div>
  </section>

  <div class="summary" id="summary"></div>

  <section>
    <h2>熱門題材數<small>近 60 個交易日</small></h2>
    <div class="chart">
      <svg id="trend" viewBox="0 0 420 200" role="img" aria-label="近 60 日每日熱門題材數"></svg>
      <div class="legend"><span><i style="background:var(--accent)"></i>熱門題材數</span><span><i style="background:var(--muted);border-radius:50%"></i>大盤漲跌相近時的近三年平均</span></div>
      <div class="tip" id="tip">點長條看當天數字</div>
    </div>
  </section>

  <section>
    <h2 id="hotTitle">當日熱門題材</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>近 20 日上榜熱度<small>藍格＝當天上榜，右側為 20 日上榜次數</small></h2>
    <div class="scroll"><table class="heat" id="heat"></table></div>
  </section>

  <section>
    <h2>全部題材<small>點欄位排序</small></h2>
    <div class="scroll"><table class="all" id="all"></table></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const RULE_TXT = {A:'A 齊漲',B:'B 帶頭擴散',C:'C 強勢'};
const $ = id => document.getElementById(id);
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const pct = v => v == null ? '—' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
const fmtD = d => `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}`;
const bucket = x => x == null ? null : x <= -2 ? 0 : x <= -1 ? 1 : x < 0 ? 2 : x < 1 ? 3 : x < 2 ? 4 : 5;
const BUCKET_TXT = ['跌 2% 以上','跌 1～2%','跌 0～1%','漲 0～1%','漲 1～2%','漲 2% 以上'];
let D, TH, idx, sortKey = 'avg', sortDir = -1;

let HIST_LOADED = false, INTRA = null;
// keep：重新整理時保留目前選的日期；原本在看最新一天的，跳到新的最新一天
function loadData(keep){
  return fetch('data.json?t=' + Date.now(), {cache:'no-cache'}).then(r => r.json()).then(data => {
    const wasLatest = !D || $('day').value === D[D.length - 1].d;
    D = data.days; TH = data.meta.themes; window.META = data.meta;
    window.BA = data.meta.bucket_avg; HIST_LOADED = false;
    D.forEach(d => d.hits = d.t.filter(r => r[0]).length);
    const sel = $('day');
    const all = [...(META.hist_dates || []), ...D.map(d => d.d)];
    const prev = sel.value;
    sel.innerHTML = all.map(d => `<option value="${d}">${fmtD(d)}</option>`).reverse().join('');
    let start = D[D.length - 1].d;
    if (keep) { if (!wasLatest && all.includes(prev)) start = prev; }
    else { try { const h = location.hash.slice(1); if (all.includes(h)) start = h; } catch(e) {} }
    sel.value = start;
    go(start);
    loadIntra();
  });
}
$('day').addEventListener('change', () => go($('day').value));
loadData(false).catch(() => { $('sub').textContent = '資料讀取失敗，請按「重新整理」再試。'; });
$('refresh').addEventListener('click', () => {
  const b = $('refresh'); b.disabled = true; b.textContent = '更新中…';
  loadData(true).then(() => {
    const t = new Date(); b.textContent = `已更新 ${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
  }).catch(() => { b.textContent = '更新失敗，再按一次'; })
    .finally(() => { b.disabled = false; setTimeout(() => { b.textContent = '重新整理'; }, 4000); });
});

function loadIntra(){
  fetch('intraday.json?t=' + Date.now(), {cache:'no-cache'}).then(r => r.ok ? r.json() : null).then(x => {
    const last = D && D[D.length - 1].d;
    if (!x || !last || x.date <= last) { INTRA = null; $('intra').hidden = true; return; }  // 收盤資料已出，就不顯示盤中暫定
    INTRA = x;
    if (idx === D.length - 1) render(idx);  // 看最新一天時，摘要與熱門題材改用盤中暫定
    const G = META.groups || [], gi = t => G[TH.indexOf(t)] || '傳產';
    const rows = x.hits.slice().sort((a, b) => (gi(a[0]) === '電子' ? 0 : 1) - (gi(b[0]) === '電子' ? 0 : 1) || b[2] - a[2]);
    $('intraSub').textContent = `${x.time} 抓取・報價至 ${x.quote_time || '—'}・上榜 ${x.hits.length}/${x.active}・收盤後以正式資料為準`;
    $('intraBody').innerHTML = rows.length ? rows.map((r, k) => (k === 0 || gi(rows[k-1][0]) !== gi(r[0]) ? `<div class="g">${gi(r[0])}</div>` : '')
      + `<div class="row"><span>${r[0]} <span class="chip rule">${r[1]}</span></span><span class="num"><span class="${cls(r[2])}">${pct(r[2])}</span>　≥3% ${r[3]}/${r[4]}</span></div>`).join('')
      : '<div class="row">目前沒有題材上榜</div>';
    $('intra').hidden = false;
  }).catch(() => {});
}
setInterval(loadIntra, 120000);

function go(ds){
  const i = D.findIndex(d => d.d === ds);
  // 近期資料不足 20 天，或某題材連續上榜一路延伸到近期資料起點時，需載入更早的歷史才算得準
  const trunc = i >= 0 && !HIST_LOADED && TH.some((_, ti) => streak(ti, i) > i);
  if (i >= 0 && ((i >= 59 && !trunc) || HIST_LOADED || !(META.hist_dates || []).length)) return render(i);
  $('sub').textContent = '讀取歷史資料中…';
  fetch('history.json', {cache:'no-cache'}).then(r => r.json()).then(h => {
    if (!HIST_LOADED) { h.days.forEach(d => d.hits = d.t.filter(r => r[0]).length); D = h.days.concat(D); HIST_LOADED = true; }
    render(D.findIndex(d => d.d === ds));
  }).catch(() => { $('sub').textContent = '歷史資料讀取失敗，請稍後再試。'; });
}

function streak(ti, i){ let n = 0; while (i >= 0 && D[i].t[ti][0]) { n++; i--; } return n; }
function count(ti, i, w){ let n = 0; for (let k = Math.max(0, i-w+1); k <= i; k++) if (D[k].t[ti][0]) n++; return n; }

function render(i){
  idx = i;
  // 盤中：看最新一天、且有比它新的盤中暫定 → 摘要與當日熱門題材改用盤中資料（其他區塊仍為收盤正式資料）
  const live = i === D.length - 1 && INTRA && INTRA.date > D[i].d && INTRA.hits.every(r => r.length > 5) ? INTRA : null;
  const d = live ? {d: live.date, tx: live.tx, hits: live.hits.length,
    t: TH.map(t => { const r = live.hits.find(h => h[0] === t); return r ? [r[1], r[2], r[3], r[4], r[6] || 0, r[5]] : ['']; })} : D[i];
  const ba = live ? ((META.ba_now || [])[bucket(d.tx)] ?? null) : (d.ba ?? null);
  const liveTag = live ? `${fmtD(live.date)} 盤中暫定 ${live.time}（報價至 ${live.quote_time || '—'}，收盤後以正式資料為準）` : '';
  $('sub').textContent = live ? liveTag : `資料日 ${fmtD(d.d)}・更新 ${META.generated}`;
  // 摘要
  let tag = '', tagCls = '';
  if (ba != null && ba > 0) {
    const r = d.hits / ba;
    tag = r >= 1.3 ? '擴散偏廣' : r <= 0.7 ? '擴散偏窄' : '與平常相當';
    tagCls = r >= 1.3 ? 'wide' : r <= 0.7 ? 'narrow' : '';
  }
  $('summary').innerHTML = `
    <div class="big">${d.hits}<span>/ ${live ? live.active : d.t.filter(r => r.length).length}</span></div>
    <div class="facts">
      <div>加權指數 <b class="${cls(d.tx)}">${pct(d.tx)}</b></div>
      <div>大盤${BUCKET_TXT[bucket(d.tx)] ?? ''}的日子，近三年平均 <b>${ba != null ? ba.toFixed(1) : '—'}</b> 個上榜</div>
      ${(() => { const c = contSummary(i); return c ? `<div>本週主流族群 <b>${c.week}</b> 個${c.prog ? '（進行中）' : ''}・當日主流 <b>${c.day}</b> 個</div>` : ''; })()}
      ${tag ? `<div><span class="badge ${tagCls}">${tag}</span></div>` : ''}
      ${live ? `<div><span class="badge live">盤中暫定 ${live.time}</span></div>` : ''}
    </div>`;
  drawTrend(i);
  // 今日熱門（盤中：連續天數與近 5／20 日次數把今天算進去）
  const hot = d.t.map((r, ti) => ({r, ti})).filter(x => x.r[0]);
  $('hotTitle').textContent = live ? `盤中熱門題材（${hot.length}）・${live.time} 暫定` : `當日熱門題材（${hot.length}）`;
  const cnt = (ti, w) => live ? count(ti, i, w - 1) + 1 : count(ti, i, w);
  hot.forEach(x => { x.s = live ? streak(x.ti, i) + 1 : streak(x.ti, i); x.c20 = cnt(x.ti, 20); });
  hot.sort((a,b) => b.s - a.s || b.c20 - a.c20 || b.r[1] - a.r[1]);
  $('cards').innerHTML = hot.length ? hot.map(({r, ti, s, c20}) => `
    <article class="card">
      <div class="top"><h3>${TH[ti]}</h3><span class="avg ${cls(r[1])}">${pct(r[1])}</span></div>
      <div class="meta">
        ${s > 1 ? `<span class="chip streak">連續 ${s} 天</span>` : `<span class="chip new">新上榜</span>`}
        ${[...r[0]].map(k => `<span class="chip rule">${RULE_TXT[k]}</span>`).join('')}
        <span class="chip">近5日 ${cnt(ti, 5)} 次</span><span class="chip">近20日 ${c20} 次</span>
        <span class="chip">≥3%：${r[2]}/${r[3]}${r[4] ? `・漲停 ${r[4]}` : ''}</span>
      </div>
      <div class="members">${r[5].map(([n, p]) => `<span>${n}<b class="${cls(p)}">${pct(p)}</b></span>`).join('')}</div>
    </article>`).join('')
    : `<div class="empty">這天沒有題材符合上榜規則。</div>`;
  drawHeat(i);
  drawTable(i);
  $('foot').innerHTML = `
    <div class="leg">
      <h4>上榜規則 ${META.rule_version}<small>符合任一條就上榜</small></h4>
      <dl>
        <dt><span class="chip rule">A 齊漲</span></dt><dd>漲 ≥3% 的成分股 ≥3 檔，且佔 ≥25%</dd>
        <dt><span class="chip rule">B 帶頭擴散</span></dt><dd>漲 ≥4% 的 ≥2 檔，且漲 ≥1.5% 的佔 ≥40%</dd>
        <dt><span class="chip rule">C 強勢</span></dt><dd>漲 ≥7% 的 ≥2 檔</dd>
      </dl>
    </div>
    <div class="leg">
      <h4>狀態<small>月線＝20 日均線；比例＝站上自身月線的成分股比例</small></h4>
      <dl>
        <dt><span class="lab lab-M">主流</span></dt><dd>族群站上月線、比例 ≥70%，且接近 60 日高點或近 20 日上榜 ≥8 天</dd>
        <dt><span class="lab lab-C">延續</span></dt><dd>族群站上月線、比例 ≥50%</dd>
        <dt><span class="lab lab-D">分化</span></dt><dd>族群站上月線，但比例 &lt;50%（靠少數股撐）</dd>
        <dt><span class="lab lab-W">轉弱</span></dt><dd>族群跌破月線，比例 &lt;40%</dd>
        <dt><span class="lab lab-S">盤整</span></dt><dd>其他情況</dd>
      </dl>
    </div>
    <div class="leg">
      <h4>標記</h4>
      <dl>
        <dt><span class="wk wk5">3</span></dt><dd>本週主流天數 ≥3，本週算一個主流週</dd>
        <dt><span class="wk wk1">2</span></dt><dd>本週主流天數 1～2，還沒達標</dd>
        <dt><span class="wk wk0">·</span></dt><dd>本週沒有主流</dd>
        <dt><b>7</b> / <span class="carry">7</span></dt><dd>主流週、延續週：連續幾週。灰字＝本週還沒達標，暫時沿用上週的週數</dd>
        <dt><b>粗體</b><span class="hitdot"> ●</span></dt><dd>當天有上榜</dd>
        <dt><sup class="few">少</sup></dt><dd>成分股 5 檔以下，一檔漲跌就影響很大</dd>
      </dl>
    </div>
    <p class="fine">題材表 ${META.themes_version}・延續性 ${META.cont_rule || ''}・資料 ${fmtD(META.first_day)} 起・來源：證交所、櫃買中心。只供觀察，不是交易訊號。</p>`;
}

function drawTrend(i){
  const s = Math.max(0, i - 59), seg = D.slice(s, i + 1);
  const W = 420, H = 200, L = 26, R = 4, T = 10, B = 24;
  const maxV = Math.max(10, ...seg.map(d => d.hits));
  const top = Math.ceil(maxV / 10) * 10;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / seg.length;
  let g = '';
  for (let v = 0; v <= top; v += top / 2) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  seg.forEach((d, k) => {
    const x = L + k * bw, h = y(0) - y(d.hits), w = Math.max(2, bw - 2), sel = s + k === i;
    g += `<rect x="${x+1}" y="${y(d.hits) + (h>0?0:0)}" width="${w}" height="${Math.max(0,h)}" rx="2" fill="var(--accent)" opacity="${sel ? 1 : 0.55}"/>`;
    const ba = d.ba ?? null;
    if (ba != null) g += `<circle cx="${x + 1 + w/2}" cy="${y(ba)}" r="2.2" fill="var(--muted)"/>`;
    g += `<rect x="${x}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" data-k="${s+k}" style="cursor:pointer"/>`;
  });
  const lab = [0, Math.floor(seg.length/2), seg.length-1];
  lab.forEach(k => { const x = L + k*bw + bw/2; g += `<text x="${x}" y="${H-8}" text-anchor="${k===0?'start':k===seg.length-1?'end':'middle'}" font-size="11" fill="var(--muted)">${fmtD(seg[k].d).slice(5)}</text>`; });
  const svg = $('trend'); svg.innerHTML = g;
  svg.onclick = svg.onmousemove = e => {
    const k = e.target.dataset && e.target.dataset.k; if (k == null) return;
    const d = D[+k], ba = d.ba ?? null;
    $('tip').innerHTML = `${fmtD(d.d)}：熱門 <b>${d.hits}</b> 個，加權 <span class="${cls(d.tx)}">${pct(d.tx)}</span>，同級近三年平均 ${ba != null ? ba.toFixed(1) : '—'}`;
  };
  const ba = D[i].ba ?? null;
  $('tip').innerHTML = `${fmtD(D[i].d)}：熱門 <b>${D[i].hits}</b> 個，加權 <span class="${cls(D[i].tx)}">${pct(D[i].tx)}</span>，同級近三年平均 ${ba != null ? ba.toFixed(1) : '—'}`;
}

function drawHeat(i){
  const s = Math.max(0, i - 19), days = D.slice(s, i + 1);
  const G = META.groups || [], GO = ['電子', '傳產'], go = g => { const k = GO.indexOf(g); return k < 0 ? 9 : k; };
  const rows = TH.map((t, ti) => ({t, ti, g: G[ti] || '傳產', n: count(ti, i, 20), st: streak(ti, i)})).filter(r => r.n > 0 && D[i].t[r.ti].length)
    .sort((a, b) => go(a.g) - go(b.g) || b.n - a.n || b.st - a.st);
  if (!rows.length) { $('heat').innerHTML = '<tr><td class="empty">近 20 日沒有題材上榜。</td></tr>'; return; }
  $('heat').innerHTML = rows.map((r, k) => (k === 0 || rows[k-1].g !== r.g ? `<tr class="grp"><th colspan="${days.length + 2}">${r.g}</th></tr>` : '')
    + `<tr><th>${r.t}</th>${days.map(d => `<td class="c${d.t[r.ti][0] ? ' on' : ''}" title="${fmtD(d.d)}"></td>`).join('')}<td class="n">${r.n}</td></tr>`).join('')
    + `<tr class="axis"><th></th><td colspan="${days.length}"><div style="display:flex;justify-content:space-between"><span>${fmtD(days[0].d).slice(5)}</span><span>${fmtD(days[days.length-1].d).slice(5)}</span></div></td><td></td></tr>`;
}

const LAB = {M: '主流', C: '延續', D: '分化', W: '轉弱', S: '盤整'}, LAB_ORD = {M: 5, C: 4, D: 3, S: 2, W: 1};
function weekOf(ds){ const t = new Date(Date.UTC(+ds.slice(0,4), +ds.slice(4,6) - 1, +ds.slice(6))); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear(); return y * 100 + Math.ceil(((t - Date.UTC(y, 0, 1)) / 864e5 + 1) / 7); }
function weekProg(i){ return i === D.length - 1 && new Date().getDay() !== 6 && new Date().getDay() !== 0 && weekOf(D[i].d) === weekOf(new Date().toISOString().slice(0,10).replace(/-/g,'')); }
function contSummary(i){
  const d = D[i]; if (!d || !d.L) return null;
  const w = d.w || {};
  return {week: Object.values(w).filter(v => v[0] >= ((META.cont || {}).week_min || 3)).length, day: [...d.L].filter(c => c === 'M').length, prog: weekProg(i)};
}
function drawTable(i){
  const d = D[i];
  const G = META.groups || [], GO = ['電子', '傳產'], go = g => { const k = GO.indexOf(g); return k < 0 ? 9 : k; };
  const rows = TH.map((t, ti) => [t, ti]).filter(([t, ti]) => d.t[ti].length).map(([t, ti]) => { const r = d.t[ti]; return {t, g: G[ti] || '傳產', hit: r[0], avg: r[1], ge3: r[2], n: r[3], ge3r: r[3] ? r[2] / r[3] : 0, c5: count(ti, i, 5), c20: count(ti, i, 20), st: streak(ti, i),
    lab: (d.L || '')[ti] || '-', labo: LAB_ORD[(d.L || '')[ti]] || 0, wm: ((d.w || {})[ti] || [0])[0], wmc: ((d.w || {})[ti] || [0,0])[1], ms: ((d.w || {})[ti] || [0,0,0])[2], cs: ((d.w || {})[ti] || [0,0,0,0])[3],
    few: ((META.members || {})[t] || []).length <= 5}; });
  rows.sort((a, b) => { const sk = sortKey === 'ge3' ? 'ge3r' : sortKey === 'lab' ? 'labo' : sortKey, x = a[sk] ?? -999, y = b[sk] ?? -999; return go(a.g) - go(b.g) || (typeof x === 'string' ? sortDir * x.localeCompare(y) : sortDir * (x - y)); });
  const cols = [['t','題材'],['avg','均漲'],['ge3','≥3%'],['c5','近5日'],['c20','近20日'],['st','連續'],['lab','狀態'],['wm','本週主流'],['ms','主流週'],['cs','延續週']];
  $('all').innerHTML = `<thead><tr>${cols.map(([k, n]) => `<th data-k="${k}" class="${k === sortKey ? 'sorted' : ''}">${n}${k === sortKey ? (sortDir < 0 ? ' ▼' : ' ▲') : ''}</th>`).join('')}</tr></thead><tbody>`
    + rows.map((r, k) => (k === 0 || rows[k-1].g !== r.g ? `<tr class="grp"><td colspan="${cols.length}"><span class="gl">${r.g}</span></td></tr>` : '') + `<tr class="${r.hit ? 'hit' : ''}"><td>${r.t}${r.few ? '<sup class="few" title="成分股 5 檔以下，一檔變動影響一致性 20～33%">少</sup>' : ''}</td><td class="${cls(r.avg)}">${pct(r.avg)}</td><td>${r.ge3}/${r.n}</td><td>${r.c5}</td><td>${r.c20}</td><td>${r.st || ''}</td><td>${LAB[r.lab] ? `<span class="lab lab-${r.lab}">${LAB[r.lab]}</span>` : '—'}</td><td><span class="wk wk${r.wm}">${r.wm || '·'}</span></td><td>${r.ms ? `<span class="${r.wm < 3 ? 'carry' : ''}">${r.ms}</span>` : ''}</td><td>${r.cs ? `<span class="${r.wmc < 3 ? 'carry' : ''}">${r.cs}</span>` : ''}</td></tr>`).join('') + '</tbody>';
  $('all').querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k; if (k === sortKey) sortDir = -sortDir; else { sortKey = k; sortDir = k === 't' ? 1 : -1; }
    drawTable(idx);
  });
}
</script>
